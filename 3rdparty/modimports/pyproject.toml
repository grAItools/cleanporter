[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modimports"
version = "0.1.0"
description = "Enforce Google Python Style Guide 2.2: import modules and packages only, not individual objects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "libcst>=1.1",
    "typer>=0.12",
]

[project.scripts]
modimports = "modimports.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/modimports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer requires calls (Argument/Option) in parameter defaults.
"src/modimports/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
