name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository or to any package
# registry, it only needs to read the checked-out code.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--locked` fails the job if uv.lock is out of date with respect to
      # pyproject.toml, rather than quietly updating it.
      - name: Sync the locked environment
        run: uv sync --locked

      # The hook environments (the pinned ruff-pre-commit repo) are the only
      # thing prek fetches; the local hooks reuse the uv environment above.
      - name: Cache the prek hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-lint-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # One step, and not a re-spelling of the hooks: .pre-commit-config.yaml
      # is the single definition of what lint and type checking mean here, and
      # running anything else would let CI and the git hooks drift in their
      # options. This covers ruff-check, ruff-format, license headers and all four type
      # checkers -- mypy, pyright, zuban and pyrefly.
      #
      # The ruff hooks run with `--fix`, so on a violation they rewrite the
      # file and prek fails the run because a hook modified it.
      # `--show-diff-on-failure` prints what it changed, which is the actual
      # answer to "why did lint fail".
      #
      # The pyright PyPI wrapper fetches its own Node runtime on first use.
      # That works on GitHub-hosted runners; it just costs a few seconds.
      - name: prek (ruff, license headers, mypy, pyright, zuban, pyrefly)
        run: uv run prek run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Sync the locked environment
        run: uv sync --locked

      - name: pytest
        if: matrix.python-version != '3.12'
        run: uv run pytest

      - name: pytest with branch coverage
        if: matrix.python-version == '3.12'
        run: uv run coverage run -m pytest

      # Run each report independently so a failed test or coverage gate cannot
      # prevent the remaining reports from being generated and uploaded.
      - name: XML coverage report
        if: always() && matrix.python-version == '3.12' && hashFiles('.coverage') != ''
        run: uv run coverage xml --fail-under=0

      - name: HTML coverage report
        if: always() && matrix.python-version == '3.12' && hashFiles('.coverage') != ''
        run: uv run coverage html --fail-under=0

      - name: Coverage report and baseline gate
        if: always() && matrix.python-version == '3.12' && hashFiles('.coverage') != ''
        run: uv run coverage report

      - name: Upload coverage reports
        if: always() && matrix.python-version == '3.12' && hashFiles('.coverage') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: error

  # Only the tests: the lint job's type checkers and ruff read source, not the
  # platform, so running them twice would prove nothing new. What differs on
  # Windows is the tool's behaviour -- path spelling in reports, `Scripts\`
  # venv layouts, CRLF, file replacement -- and the suite is what exercises it.
  #
  # Tests that cannot mean anything here (a `/bin/sh` stub interpreter, POSIX
  # mode bits, non-UTF-8 filenames) are skipped with a reason, and `-ra`
  # prints every skip, xfail and failure in the summary, so a red run -- or a
  # quietly skipped one -- says which and why without a log dive.
  test-windows:
    name: Tests (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the newest: the ends of what the Linux matrix covers.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Sync the locked environment
        run: uv sync --locked

      - name: pytest
        run: uv run pytest -ra
