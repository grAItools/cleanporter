name: Documentation

on:
  push:
    branches: [main]
  pull_request:

# The standard GitHub Pages set: read the repo, publish a Pages deployment,
# and mint the OIDC token that `actions/deploy-pages` exchanges for it.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already on its way to Pages; superseded
# pull-request builds, on the other hand, are safe to drop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--locked` pins zensical to the version in uv.lock, so the site that
      # CI publishes is the one `uv run --group docs zensical build` produces
      # locally.
      - name: Sync the locked docs environment
        run: uv sync --locked --group docs

      # `--strict` turns soft warnings -- a link to a page that does not
      # exist, chiefly -- into a build failure. Without it this step exits 0
      # on a broken site and the pull-request build below proves nothing.
      - name: Build the site
        run: uv run --group docs zensical build --clean --strict

      # Everything above also runs on pull requests, which is the point: a
      # broken docs build fails the PR. Only pushes to main go on to publish.
      # One-time setup, per repository: Pages must already be enabled with
      # "GitHub Actions" as the source, or this step fails with "Get Pages
      # site failed". Settings > Pages, or:
      #
      #     gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      #
      # `enablement: true` does NOT substitute for that: the default
      # GITHUB_TOKEN cannot create a Pages site ("Resource not accessible by
      # integration"), because that needs administration rights a workflow
      # token is not granted.
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
