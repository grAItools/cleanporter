name: Release

# Pushing a version tag is the whole release: build once, check the tag against
# pyproject.toml, then publish those same files as a GitHub release and --
# only where the repository has opted in -- to PyPI. See CONTRIBUTING.md,
# "Releasing".
on:
  push:
    tags: ["v*"]

# Least privilege by default; the two jobs that write get exactly what they
# write with, and nothing else does.
permissions:
  contents: read

# One run per tag at a time: the group is the tag itself, so different tags
# never wait on each other, and a run for a tag that is deleted and pushed
# again queues behind the one in progress instead of cancelling it half-way
# through a publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      # Full history, so the tagged commit can be checked against main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No cache: nothing restored from an earlier run should be able to end
      # up in a published artifact.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      # A release is a merged commit: a tag on a branch that never went
      # through review, CI and a merge is refused.
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release: $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag a merged commit" >&2
            exit 1
          fi

      # The wheel takes its version from pyproject.toml, not from the tag, and
      # PyPI never accepts a version twice: a mismatch has to stop here.
      - name: The tag names project.version
        run: >-
          uv run --no-project --python 3.12
          python .github/scripts/release.py check-tag "$GITHUB_REF_NAME"

      # Outside the checkout: the sdist takes every file there that git does
      # not ignore, and a published sdist can never be replaced.
      - name: Release notes from CHANGELOG.md
        run: |
          mkdir "$RUNNER_TEMP/notes"
          uv run --no-project --python 3.12 \
            python .github/scripts/release.py notes "${GITHUB_REF_NAME#v}" \
            > "$RUNNER_TEMP/notes/notes.md"
          cat "$RUNNER_TEMP/notes/notes.md"

      # CI ran on the merge, but this is the exact tree being published.
      - name: The test suite passes on the tagged commit
        run: |
          uv sync --locked --python 3.12
          uv run --python 3.12 pytest -q

      # The sdist is the tagged tree and nothing else: a file any step above
      # left behind (not ignored by .gitignore) would be published with it.
      - name: The checkout is exactly the tagged commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain >&2
            echo "release: the checkout changed before the build; see above" >&2
            exit 1
          fi

      # --no-sources: build as a user's installer would, ignoring any
      # [tool.uv.sources] override that only exists in this checkout.
      - name: Build the sdist and wheel
        run: uv build --no-sources

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # Kept apart from dist/: the PyPI upload takes every file in dist/.
      - name: Upload the release notes
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes

      # A PEP 440 pre- or dev-release (0.5.0rc1, 1.0.0b2, 0.5.0.dev0,
      # 0.5.0rc1.post1, 0.5.0.post1.dev0) is marked as a pre-release, so it
      # is never shown as "Latest". check-tag has already required the
      # normalised form, so a, b, rc or dev anywhere after the release
      # numbers makes one; only `.postN` alone does not.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "${GITHUB_REF_NAME#v}" =~ ^[0-9]+(\.[0-9]+)*(.*)$ ]]
          if [[ "${BASH_REMATCH[2]}" =~ (a|b|rc|dev)[0-9] ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes/notes.md \
            --verify-tag \
            "${prerelease[@]}"

  # Off unless the repository variable PUBLISH_TO_PYPI is 'true' (Settings >
  # Secrets and variables > Actions > Variables). Without it the job is
  # skipped, not failed, and the GitHub release above still happens.
  #
  # Trusted publishing: no token is stored anywhere. PyPI trusts an OIDC token
  # minted for this repository, this workflow file (release.yml) and the
  # `pypi` environment -- the publisher configured on pypi.org must name all
  # three, and the environment is where required reviewers can be added.
  pypi:
    name: PyPI
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cleanporter/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
