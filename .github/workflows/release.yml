name: Release

# A release is a version tag, and there are two ways to make one (see
# CONTRIBUTING.md, "Releasing"):
#
# - push the tag: the release is of the tagged commit;
# - run this workflow from the Actions tab on `main`, naming the tag: an
#   existing tag is released as if it had just been pushed, and a missing one
#   is created on the dispatched commit of `main` by the GitHub-release job.
#
# Either way: build once, check the tag against pyproject.toml, then publish
# those same files as a GitHub release and -- only where the repository has
# opted in -- to PyPI.
#
# The release machinery (.github/scripts/release.py and the curated notes in
# .github/release-notes/) always comes from this workflow's own revision,
# $GITHUB_SHA -- the tag on a push, `main` on a dispatch -- while what is
# tested and built is the tag's tree. So a tag that predates the machinery
# (v0.4.0) can still be released, by a dispatch from `main`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          The tag to release, e.g. v0.4.0. If it does not exist, it is created
          on the commit of main this run is for.
        required: true
        type: string

# Least privilege by default; the two jobs that write get exactly what they
# write with, and nothing else does.
permissions:
  contents: read

# One run per tag at a time: the group is the tag itself, however the run was
# started, so different tags never wait on each other, and a second run for a
# tag queues behind the one in progress instead of cancelling it half-way
# through a publish.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Handed to every script through the environment, never spliced into one: on a
# dispatch it is free text.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.subject.outputs.commit }}
      create-tag: ${{ steps.subject.outputs.create-tag }}
    steps:
      # Full history and every tag, so the tag can be found and checked
      # against main. This checks out $GITHUB_SHA; the step that settles what
      # is released checks out the tag's tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No cache: nothing restored from an earlier run should be able to end
      # up in a published artifact.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      # Read out of git rather than the working tree, and kept outside the
      # checkout: the tag's tree replaces the working tree below and may not
      # have these files at all, and anything left in the checkout would be
      # packed into the sdist. release.py finds the notes relative to itself,
      # so the copy keeps the repository's layout.
      - name: The release machinery from this workflow's revision
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "release: run this workflow from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$TAG"; then
            echo "release: '$TAG' is not a valid tag name" >&2
            exit 1
          fi
          machinery="$RUNNER_TEMP/machinery"
          mkdir -p "$machinery/.github/scripts" "$machinery/.github/release-notes"
          git show "$GITHUB_SHA:.github/scripts/release.py" \
            > "$machinery/.github/scripts/release.py"
          # A missing notes file stays missing: release.py says so, clearly.
          notes=".github/release-notes/${TAG#v}.md"
          if git cat-file -e "$GITHUB_SHA:$notes" 2>/dev/null; then
            git show "$GITHUB_SHA:$notes" > "$machinery/$notes"
          fi

      # What is released: the tag's commit if the tag exists; otherwise, on a
      # dispatch only, the dispatched commit of main, which the GitHub-release
      # job tags. An existing GitHub release is never overwritten.
      - name: The tag, and no release for it yet
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if commit=$(git rev-parse --quiet --verify "refs/tags/$TAG^{commit}"); then
            create_tag=false
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            commit=$GITHUB_SHA
            create_tag=true
            echo "release: $TAG does not exist; it will be created on main at $commit"
          else
            echo "release: the tag $TAG is not in the checkout" >&2
            exit 1
          fi
          if response=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1); then
            echo "release: a GitHub release for $TAG already exists; not overwriting it" >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            echo "$response" >&2
            echo "release: could not check for an existing GitHub release of $TAG" >&2
            exit 1
          fi
          git checkout --quiet --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "create-tag=$create_tag" >> "$GITHUB_OUTPUT"

      # A release is a merged commit: a tag on a branch that never went
      # through review, CI and a merge is refused.
      - name: The released commit is on main
        env:
          COMMIT: ${{ steps.subject.outputs.commit }}
        run: |
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "release: $TAG ($COMMIT) is not on main; tag a merged commit" >&2
            exit 1
          fi

      # The wheel takes its version from pyproject.toml, not from the tag, and
      # PyPI never accepts a version twice: a mismatch has to stop here. The
      # script is this revision's; the pyproject.toml is the released tree's.
      - name: The tag names project.version
        run: >-
          uv run --no-project --python 3.12
          python "$RUNNER_TEMP/machinery/.github/scripts/release.py"
          check-tag "$TAG" pyproject.toml

      # Outside the checkout: the sdist takes every file there that git does
      # not ignore, and a published sdist can never be replaced.
      - name: Release notes from .github/release-notes
        run: |
          mkdir "$RUNNER_TEMP/notes"
          uv run --no-project --python 3.12 \
            python "$RUNNER_TEMP/machinery/.github/scripts/release.py" notes "${TAG#v}" \
            > "$RUNNER_TEMP/notes/notes.md"
          cat "$RUNNER_TEMP/notes/notes.md"

      # CI ran on the merge, but this is the exact tree being published, with
      # its own lockfile.
      - name: The test suite passes on the released commit
        run: |
          uv sync --locked --python 3.12
          uv run --python 3.12 pytest -q

      # The sdist is the released tree and nothing else: a file any step above
      # left behind (not ignored by .gitignore) would be published with it.
      - name: The checkout is exactly the released commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain >&2
            echo "release: the checkout changed before the build; see above" >&2
            exit 1
          fi

      # --no-sources: build as a user's installer would, ignoring any
      # [tool.uv.sources] override that only exists in this checkout.
      - name: Build the sdist and wheel
        run: uv build --no-sources

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # Kept apart from dist/: the PyPI upload takes every file in dist/.
      - name: Upload the release notes
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes

      # A PEP 440 pre- or dev-release (0.5.0rc1, 1.0.0b2, 0.5.0.dev0,
      # 0.5.0rc1.post1, 0.5.0.post1.dev0) is marked as a pre-release, so it
      # is never shown as "Latest". check-tag has already required the
      # normalised form, so a, b, rc or dev anywhere after the release
      # numbers makes one; only `.postN` alone does not.
      #
      # An existing tag must still be there (--verify-tag). A missing one is
      # created on $GITHUB_SHA, the commit of main the build checked -- unless
      # it has appeared since, pointing who knows where. A tag created with
      # GITHUB_TOKEN does not trigger workflows, so creating it here does not
      # start a second, push-triggered run of this workflow.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_TAG: ${{ needs.build.outputs.create-tag }}
        run: |
          prerelease=()
          [[ "${TAG#v}" =~ ^[0-9]+(\.[0-9]+)*(.*)$ ]]
          if [[ "${BASH_REMATCH[2]}" =~ (a|b|rc|dev)[0-9] ]]; then
            prerelease=(--prerelease)
          fi
          if [[ "$CREATE_TAG" == true ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
              echo "release: $TAG was created after the build checked it; run again" >&2
              exit 1
            fi
            target=(--target "$GITHUB_SHA")
          else
            target=(--verify-tag)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes/notes.md \
            "${target[@]}" \
            "${prerelease[@]}"

  # Off unless the repository variable PUBLISH_TO_PYPI is 'true' (Settings >
  # Secrets and variables > Actions > Variables). Without it the job is
  # skipped, not failed, and the GitHub release above still happens.
  #
  # Trusted publishing: no token is stored anywhere. PyPI trusts an OIDC token
  # minted for this repository, this workflow file (release.yml) and the
  # `pypi` environment -- the publisher configured on pypi.org must name all
  # three, and the environment is where required reviewers can be added.
  pypi:
    name: PyPI
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cleanporter/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
