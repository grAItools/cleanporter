# Git hooks for cleanporter, run by prek (a Rust drop-in replacement for
# pre-commit that reads this same file format). Install them with:
#
#     uv run prek install
#
# Deliberately small: ruff is the only linter and formatter in this project,
# and the two blocking type checkers run through `uv run` so they use the
# versions pinned in uv.lock rather than a second, drifting copy.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the `ruff` pin in uv.lock.
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Run the budget test rather than the raw checkers. mypy and pyright
      # both exit non-zero on any diagnostic, and this project accepts a
      # pinned budget of libcst-induced errors -- invoking them directly here
      # would block every single commit. The test invokes both and compares
      # their counts to the budget, so this hook fails only on real new debt.
      #
      # `types: [python]` keeps it from firing on commits that touch no
      # Python; filenames are not passed because both checkers read their
      # scope from pyproject.toml.
      - id: typecheck
        name: mypy and pyright (pinned budget)
        entry: uv run pytest -m typecheck
        language: system
        types: [python]
        pass_filenames: false

      # zuban is an informational second opinion, not a gate: it lives in the
      # `manual` stage only, so it never runs on commit. Run it on demand with:
      #
      #     prek run --hook-stage manual zuban
      - id: zuban
        name: zuban (informational)
        entry: uv run --group zuban zuban mypy --strict src/cleanporter
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]
