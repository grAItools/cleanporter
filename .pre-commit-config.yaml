# Git hooks for cleanporter, run by prek (a Rust drop-in replacement for
# pre-commit that reads this same file format). Install them with:
#
#     uv run prek install
#
# Deliberately small: ruff is the only linter and formatter in this project,
# and the four blocking type checkers run through `uv run` so they use the
# versions pinned in uv.lock rather than a second, drifting copy.
#
# This file is the single definition of what lint and type checking mean here.
# CI does not re-spell these commands; its lint job runs
# `uv run prek run --all-files`, so local and CI cannot drift in options.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the `ruff` pin in uv.lock; this is a *second* ruff
    # install, in prek's own environment, and CI runs this one.
    # tests/test_toolchain_pins.py fails if the two drift apart.
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Four type checkers, all of them gates. Filenames are not passed: each
      # reads its own scope from pyproject.toml (`[tool.mypy] files`,
      # `[tool.pyright] include`, `[tool.zuban] files`, `[tool.pyrefly]
      # project-includes`), so a per-file invocation would check less than a
      # commit is judged on -- and the scopes differ, mypy and pyright taking
      # `src/cleanporter` while zuban and pyrefly also take `tests`.
      #
      # `types: [python]` keeps them from firing on commits that touch no
      # Python.
      - id: mypy
        name: mypy --strict
        entry: uv run mypy --strict
        language: system
        types: [python]
        pass_filenames: false

      # The pyright PyPI wrapper downloads its own Node runtime the first time
      # it runs. If this hook seems to hang on a fresh checkout, that is what
      # it is doing; it is fast afterwards.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      # No `--strict` on the entry: unlike mypy, zuban is configured by its own
      # `[tool.zuban]` section, which sets `strict` along with the wider scope
      # and the relaxations that make `tests/` checkable without a signature on
      # every test function. Without that section zuban would read
      # `[tool.mypy]` and inherit mypy's source-only scope.
      - id: zuban
        name: zuban
        entry: uv run zuban mypy
        language: system
        types: [python]
        pass_filenames: false

      # pyrefly reads `[tool.pyrefly]` in pyproject.toml. `check` with no
      # paths is project mode -- with paths it would ignore `project-excludes`
      # and check the fixtures.
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
