# Git hooks for cleanporter, run by prek (a Rust drop-in replacement for
# pre-commit that reads this same file format). Install them with:
#
#     uv run prek install
#
# Deliberately small: ruff is the only linter and formatter in this project,
# and the two blocking type checkers run through `uv run` so they use the
# versions pinned in uv.lock rather than a second, drifting copy.
#
# This file is the single definition of what lint and type checking mean here.
# CI does not re-spell these commands; its lint job runs
# `uv run prek run --all-files`, so local and CI cannot drift in options.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the `ruff` pin in uv.lock; this is a *second* ruff
    # install, in prek's own environment, and CI runs this one.
    # tests/test_toolchain_pins.py fails if the two drift apart.
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # `types: [python]` keeps these from firing on commits that touch no
      # Python. Filenames are not passed: both checkers read their scope from
      # pyproject.toml (`files` for mypy, `include` for pyright), so a
      # per-file invocation would check less than a commit is judged on.
      - id: mypy
        name: mypy --strict
        entry: uv run mypy --strict
        language: system
        types: [python]
        pass_filenames: false

      # The pyright PyPI wrapper downloads its own Node runtime the first time
      # it runs. If this hook seems to hang on a fresh checkout, that is what
      # it is doing; it is fast afterwards.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      # zuban is an informational second opinion, not a gate: it lives in the
      # `manual` stage only, so it never runs on commit. Run it on demand with:
      #
      #     uv run --group zuban prek run --all-files --stage manual zuban
      #
      # `--all-files` is not optional there. `prek run` otherwise considers
      # only *staged* files, and with nothing staged this hook reports
      # "(no files to check) Skipped", which reads just like a pass.
      - id: zuban
        name: zuban (informational)
        entry: uv run --group zuban zuban mypy --strict
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]
